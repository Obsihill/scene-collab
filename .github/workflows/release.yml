name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PACKAGE_DIR: unity/com.obsihill.scenecollab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test SceneCollab.slnx -c Release

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # GHCR push needs packages: write. Without it docker/login-action succeeds and the push fails
      # with 403, which reads like a credential problem rather than a permissions one.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish linux-x64
        run: >
          dotnet publish server/SceneCollab.Server.WebApi -c Release
          -r linux-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o dist/linux-x64

      - name: Publish win-x64
        run: >
          dotnet publish server/SceneCollab.Server.WebApi -c Release
          -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=false
          -o dist/win-x64

      - name: Package archives
        run: |
          cd dist
          tar -czf scene-collab-server-linux-x64.tar.gz -C linux-x64 .
          (cd win-x64 && zip -qr ../scene-collab-server-win-x64.zip .)
          cd ..

      # UPM tarball for air-gapped / GitLab mirror installs.
      - name: Package UPM tarball
        run: |
          cd "$PACKAGE_DIR"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Docker buildx
        uses: docker/setup-buildx-action@v3

      # The image is built from mcr.microsoft.com/dotnet/sdk inside the build, so the arm64 leg needs
      # emulation on an amd64 runner; without it buildx fails on the second platform.
      - name: QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/SceneCollab.Server.WebApi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scene-collab:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/scene-collab:latest

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/scene-collab-server-linux-x64.tar.gz
            dist/scene-collab-server-win-x64.zip
            dist/*.tgz
